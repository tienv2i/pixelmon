<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pixelmon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #0f1020;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      body {
        display: grid;
        place-items: center;
        /* radial vignette cho nền ngoài canvas */
        background: radial-gradient(ellipse at center, #161830 0%, #0f1020 70%);
      }
      /* RESIZE mode: container chiếm toàn bộ viewport, canvas tự fill bên trong */
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        line-height: 0;
        box-shadow: 0 0 0 1px #2e3358, 0 18px 60px rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        image-rendering: pixelated;
        border-radius: 6px;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
